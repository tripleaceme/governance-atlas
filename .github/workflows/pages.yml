# Publishes the v2 three-domain prototype to GitHub Pages for feedback.
# The production site lives on Cloudflare Pages at atlas.ayoadeabel.tech
# and is built from `main`; this workflow deploys only the v2/ folder
# from the v2-domains branch.
name: Deploy v2 preview to GitHub Pages

on:
  push:
    branches: [v2-domains]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./v2
      - id: deployment
        uses: actions/deploy-pages@v4
